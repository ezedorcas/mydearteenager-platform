<div class="tracks-grid">
  <div class="paper sheet graph" data-reveal="up">
    <span class="sheet-label">Sticker sheet</span>
    <div class="stickers" id="stickers">
      <button type="button" class="sticker" data-k="design" aria-pressed="false"><span class="ms" aria-hidden="true">palette</span><span><b>Design and creativity</b><small>Posters, brands, layouts</small></span></button>
      <button type="button" class="sticker" data-k="tech" aria-pressed="false"><span class="ms" aria-hidden="true">code</span><span><b>Technology and coding</b><small>Websites, apps, how things work</small></span></button>
      <button type="button" class="sticker" data-k="content" aria-pressed="false"><span class="ms" aria-hidden="true">videocam</span><span><b>Content creation</b><small>Video, writing, storytelling</small></span></button>
      <button type="button" class="sticker" data-k="communication" aria-pressed="false"><span class="ms" aria-hidden="true">record_voice_over</span><span><b>Communication</b><small>Public speaking, clear messages</small></span></button>
      <button type="button" class="sticker" data-k="entrepreneurship" aria-pressed="false"><span class="ms" aria-hidden="true">lightbulb</span><span><b>Entrepreneurship</b><small>Ideas, pitching, starting small</small></span></button>
      <button type="button" class="sticker" data-k="personal" aria-pressed="false"><span class="ms" aria-hidden="true">self_improvement</span><span><b>Personal development</b><small>Habits, focus, managing time</small></span></button>
    </div>
  </div>
  <div class="paper board taped" data-reveal="up" style="--i:1">
    <div class="board-top"><span class="hand">My board</span><span class="board-count" id="board-count">0 of 6</span></div>
    <div class="slots" id="slots">
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      <div class="board-empty" id="board-empty">Tap a sticker and it lands here.</div>
    </div>
    <p class="board-note" id="board-note">Can't decide? Pick more than one.</p>
  </div>
</div>
