<div class="paper calc taped" data-reveal="up" style="--i:1">
  <h3>What <span class="num" id="mins-label">20</span> minutes a day could build</h3>
  <label for="mins">Minutes a day on MDT</label>
  <input class="range" type="range" id="mins" min="10" max="60" step="5" value="20">
  <div class="calc-out">
    <div><b id="hours">20</b><span>hours of practice</span></div>
    <div><b id="projects">4</b><span>finished projects</span></div>
  </div>
  <div class="proj-row" id="proj-row" aria-hidden="true"></div>
  <p class="fine">Example only: 5 days a week over a 12-week school term, with a project roughly every 5 hours of practice. Real results depend on the course.</p>
</div>
